<!doctype html><meta charset=utf-8>
<style>body{font:13px monospace;background:#fff;color:#000;padding:8px}pre{white-space:pre-wrap}</style>
<pre id=out>carregando...</pre>
<script>
const GOOGLE=["Open Sans","Noto Sans","Source Sans 3","Lato","Fira Sans","Hind","PT Sans","Istok Web","Mukta","Cabin","Asap","Signika","Assistant","Nunito Sans","Public Sans","Titillium Web","Encode Sans Semi Expanded","Roboto","Ubuntu","Catamaran","Libre Franklin","Work Sans","Karla","DM Sans","Inter","Barlow","Rubik","Mulish","Oxygen","Overpass","Gudea","Mada","Alegreya Sans","Merriweather Sans","Scada","Rambla","Molengo","Arimo","Cantarell","Droid Sans","Varela","Questrial","Archivo","IBM Plex Sans","Sarabun","Hind Siliguri","Source Sans Pro","Frutiger","Roboto Condensed"];
const LOCAL=["Segoe UI","Tahoma","Verdana","Trebuchet MS","Corbel","Calibri","Arial","Candara","Franklin Gothic Medium","Lucida Sans Unicode","Gill Sans MT"];
const WEIGHTS=[400,500,600,700];
const link=document.createElement('link');link.rel='stylesheet';
link.href='https://fonts.googleapis.com/css?family='+GOOGLE.map(n=>n.replace(/ /g,'+')+':400,500,600,700').join('|')+'&display=swap';
document.head.appendChild(link);
// regiões das placas de nome na imagem ref.png (2070x390): [x0,y0,x1,y1,texto]
const k=2070/2000;
const REG=[[125,22,640,98,'Alonso'],[125,106,640,182,'Fisichella'],[125,190,640,266,'M Schumacher'],[125,274,640,350,'Barrichello'],
[1145,22,1660,98,'Massa'],[1145,106,1660,182,'Heidfeld'],[1145,190,1660,266,'de la Rosa'],[1145,274,1660,350,'Coulthard']].map(r=>[r[0]*k,r[1]*k,r[2]*k,r[3]*k,r[4]]);
const N=[96,24];
function bboxOfDark(data,w,h,thr){let x0=w,y0=h,x1=-1,y1=-1;for(let y=0;y<h;y++)for(let x=0;x<w;x++){const i=(y*w+x)*4;const l=(data[i]*.3+data[i+1]*.59+data[i+2]*.11);if(l<thr){if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y}}return [x0,y0,x1-x0+1,y1-y0+1]}
function norm(srcCanvas,bb,invert){const c=document.createElement('canvas');c.width=N[0];c.height=N[1];const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,N[0],N[1]);g.drawImage(srcCanvas,bb[0],bb[1],bb[2],bb[3],0,0,N[0],N[1]);const d=g.getImageData(0,0,N[0],N[1]).data;const a=new Float32Array(N[0]*N[1]);for(let i=0;i<a.length;i++){const l=(d[i*4]*.3+d[i*4+1]*.59+d[i*4+2]*.11)/255;a[i]=1-l}return a}
function corr(a,b){let ma=0,mb=0;for(let i=0;i<a.length;i++){ma+=a[i];mb+=b[i]}ma/=a.length;mb/=b.length;let n=0,da=0,db=0;for(let i=0;i<a.length;i++){const x=a[i]-ma,y=b[i]-mb;n+=x*y;da+=x*x;db+=y*y}return n/Math.sqrt(da*db)}
(async()=>{
 const img=new Image();img.src='ref.png';await img.decode();
 const rc=document.createElement('canvas');rc.width=img.width;rc.height=img.height;const rg=rc.getContext('2d');rg.drawImage(img,0,0);
 const refs=REG.map(r=>{const w=Math.round(r[2]-r[0]),h=Math.round(r[3]-r[1]);const d=rg.getImageData(r[0],r[1],w,h);const bb=bboxOfDark(d.data,w,h,110);const sub=document.createElement('canvas');sub.width=w;sub.height=h;sub.getContext('2d').putImageData(d,0,0);return {t:r[4],bb,ar:bb[2]/bb[3],a:norm(sub,bb)}});
 await new Promise(r=>setTimeout(r,2500));
 const res=[];
 for(const fam of GOOGLE.concat(LOCAL)){for(const w of WEIGHTS){
  try{await document.fonts.load(`${w} 40px "${fam}"`)}catch(e){}
  if(!document.fonts.check(`${w} 40px "${fam}"`) && GOOGLE.includes(fam)) continue;
  let sc=0,arr=0;
  for(const R of refs){const c=document.createElement('canvas');c.width=1400;c.height=200;const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.fillStyle='#000';g.font=`${w} 100px "${fam}", monospace`;g.textBaseline='alphabetic';g.fillText(R.t,40,140);const d=g.getImageData(0,0,c.width,c.height);const bb=bboxOfDark(d.data,c.width,c.height,110);if(bb[2]<=0){sc=-9;break}const a=norm(c,bb);sc+=corr(R.a,a);arr+=Math.log((bb[2]/bb[3])/R.ar)}
  res.push({fam,w,score:sc/refs.length,arLog:arr/refs.length});
 }}
 res.sort((a,b)=>(b.score-Math.abs(b.arLog)*0.5)-(a.score-Math.abs(a.arLog)*0.5));
 document.getElementById('out').textContent='ranking (score = correlação de forma; arLog = proporção largura/altura vs. real, 0 = igual)\n'+res.slice(0,30).map((r,i)=>`${i+1}. ${r.fam} ${r.w}  score=${r.score.toFixed(3)}  arLog=${r.arLog.toFixed(3)}`).join('\n');
 window.DONE=true;
})();
</script>
