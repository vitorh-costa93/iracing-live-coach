<!doctype html><meta charset=utf-8>
<style>body{font:13px monospace;padding:8px}pre{white-space:pre-wrap}</style><pre id=out>carregando...</pre>
<script>
const GOOGLE="Play,Michroma,Orbitron,Aldrich,Nova Square,Squada One,Goldman,Krona One,Syncopate,Quantico,Armata,Share Tech,Ruda,Exo,Exo 2,Saira,Saira Semi Condensed,Saira Condensed,Chakra Petch,Bai Jamjuree,Oxanium,Tomorrow,Kanit,Rajdhani,Audiowide,Jura,Electrolize,Zen Dots,Russo One,Righteous,Days One,Titillium Web,Teko,Changa,Lexend,Lexend Exa,Lexend Giga,Lexend Zetta,Unbounded,Montserrat,Raleway,Poppins,Nunito,Varela Round,Baloo 2,Quicksand,Comfortaa,Questrial,Sarpanch,Strait,Paytone One,Oswald,Rubik,Hammersmith One,Francois One,Passion One,Chivo,Archivo Black,Archivo,Barlow,Barlow Semi Condensed,Roboto,Open Sans,Asap,Jost,Hind,Maven Pro,Sen,Space Grotesk,Syne,Outfit,Urbanist,Sora,Manrope,Red Hat Display,Plus Jakarta Sans,Lato,Mukta,Cabin,Ubuntu,Signika,Oxygen,Dosis,Abel,Yantramanav,Prompt,Sarabun,Mitr,Krub,K2D,Niramit,Encode Sans Expanded,Encode Sans Semi Expanded,Noto Sans,Fira Sans,Source Sans 3,Inter,DM Sans,Work Sans,Libre Franklin,Public Sans,Mulish,Overpass,IBM Plex Sans,Heebo,Hanken Grotesk,Figtree,Albert Sans,Be Vietnam Pro,Anek Latin,Gantari,Reddit Sans,Onest,Geologica,Wix Madefor Display,Bricolage Grotesque,Instrument Sans,Rethink Sans,Schibsted Grotesk,Familjen Grotesk,Tektur,Bruno Ace,Genos,Gruppo,Nova Flat,Stick No Bills,Racing Sans One,Big Shoulders Display,Smooch Sans,Sofia Sans,Sofia Sans Semi Condensed,Radio Canada,Kumbh Sans,Lexend Deca,Epilogue,Rubik Mono One".split(',');
const LOCAL=["Segoe UI","Tahoma","Verdana","Trebuchet MS","Corbel","Calibri","Arial","Arial Black","Candara","Franklin Gothic Medium","Franklin Gothic Heavy","Lucida Sans Unicode","Impact","Bahnschrift","Arial Narrow","Century Gothic","Gill Sans MT","Eurostile","Microgramma","Bank Gothic","Agency FB","Tw Cen MT","Berlin Sans FB Demi","Gadugi","Nirmala UI","Leelawadee UI"];
const links=[];for(let i=0;i<GOOGLE.length;i+=20){const l=document.createElement('link');l.rel='stylesheet';l.crossOrigin='anonymous';
l.href='https://fonts.googleapis.com/css?family='+GOOGLE.slice(i,i+20).map(n=>n.replace(/ /g,'+')+':400,500,600,700,800,900').join('|')+'&display=swap';document.head.appendChild(l);links.push(l)}
const regs=[['r2017.webp',628,640,745,680,'0.947'],['r2017.webp',628,703,745,743,'2.643'],['r2017.webp',628,765,745,805,'3.319'],['r2017.webp',1228,575,1345,615,'4.365'],['r2017.webp',1228,640,1345,680,'5.553'],['r2017.webp',1228,703,1345,743,'8.629'],['r2017.webp',1228,765,1345,805,'9.146'],['r2017.webp',630,575,745,615,'LAP 2'],['r98a.webp',795,678,990,712,'1:43.972'],['r98c.webp',200,668,385,698,'1:43.297']];
function lumOf(d,i){return d[i]*.3+d[i+1]*.59+d[i+2]*.11}
function stats(l){const s=[...l].sort((a,b)=>a-b);return [s[Math.floor(s.length*.05)],s[Math.floor(s.length*.98)]]}
function bbox(l,w,h,thr){let x0=w,y0=h,x1=-1,y1=-1;for(let y=0;y<h;y++)for(let x=0;x<w;x++){if(l[y*w+x]>thr){if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y}}return [x0,y0,x1-x0+1,y1-y0+1]}
const N=[96,24];
function resample(l,w,h,bb,lo,hi){const a=new Float32Array(N[0]*N[1]);for(let y=0;y<N[1];y++)for(let x=0;x<N[0];x++){const sx=Math.min(w-1,Math.floor(bb[0]+(x+.5)*bb[2]/N[0])),sy=Math.min(h-1,Math.floor(bb[1]+(y+.5)*bb[3]/N[1]));a[y*N[0]+x]=Math.max(0,Math.min(1,(l[sy*w+sx]-lo)/(hi-lo)))}return a}
function corr(a,b){let ma=0,mb=0;for(let i=0;i<a.length;i++){ma+=a[i];mb+=b[i]}ma/=a.length;mb/=b.length;let n=0,da=0,db=0;for(let i=0;i<a.length;i++){const x=a[i]-ma,y=b[i]-mb;n+=x*y;da+=x*x;db+=y*y}return n/Math.sqrt(da*db)}
const load=src=>new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.src=src});
(async()=>{
 const imgs={};for(const r of regs)if(!imgs[r[0]])imgs[r[0]]=await load(r[0]);
 const refs=regs.map(r=>{const im=imgs[r[0]];const c=document.createElement('canvas');c.width=im.width;c.height=im.height;const g=c.getContext('2d');g.drawImage(im,0,0);const w=r[3]-r[1],h=r[4]-r[2];const d=g.getImageData(r[1],r[2],w,h).data;const l=new Float32Array(w*h);for(let i=0;i<w*h;i++)l[i]=lumOf(d,i*4);const [lo,hi]=stats(l);const bb=bbox(l,w,h,(lo+hi)/2+15);return {t:r[5],ar:bb[2]/bb[3],a:resample(l,w,h,bb,lo,hi)}});
 await new Promise(r=>setTimeout(r,6000));
 // pesos realmente disponíveis por família
 const avail={};for(const ss of document.styleSheets){let rules;try{rules=ss.cssRules}catch(e){continue}for(const ru of rules){if(ru.type===5){const f=ru.style.fontFamily.replace(/['"]/g,'');(avail[f]=avail[f]||new Set()).add(parseInt(ru.style.fontWeight))}}}
 const cv=document.createElement('canvas');cv.width=1700;cv.height=220;const g=cv.getContext('2d',{willReadFrequently:true});
 const res=[];let done=0;
 const cands=[];for(const f of GOOGLE){for(const w of (avail[f]?[...avail[f]]:[]))cands.push([f,w])}for(const f of LOCAL){for(const w of [400,700])cands.push([f,w])}
 for(const [fam,w] of cands){
  try{await document.fonts.load(`${w} 40px "${fam}"`)}catch(e){}
  if(!LOCAL.includes(fam)&&!document.fonts.check(`${w} 40px "${fam}"`))continue;
  let sc=0,lsSum=0,bad=false;
  for(const R of refs){
   g.font=`${w} 100px "${fam}", monospace`;g.letterSpacing='0px';
   const m=g.measureText(R.t);const H=m.actualBoundingBoxAscent+m.actualBoundingBoxDescent;const W0=m.actualBoundingBoxLeft+m.actualBoundingBoxRight;
   if(!(H>10)||!(W0>10)){bad=true;break}
   const n=R.t.length-1;let ls=(R.ar*H-W0)/n;ls=Math.max(-3,Math.min(32,ls));
   g.letterSpacing=ls+'px';g.fillStyle='#000';g.fillRect(0,0,cv.width,cv.height);g.fillStyle='#fff';g.filter='blur(2px)';g.fillText(R.t,40,150);g.filter='none';
   const d=g.getImageData(0,0,cv.width,cv.height).data;const l=new Float32Array(cv.width*cv.height);for(let i=0;i<l.length;i++)l[i]=lumOf(d,i*4);
   const bb=bbox(l,cv.width,cv.height,128);if(bb[2]<=2){bad=true;break}
   sc+=corr(R.a,resample(l,cv.width,cv.height,bb,0,255));lsSum+=ls/100;
  }
  if(!bad)res.push({fam,w,score:sc/refs.length,ls:lsSum/refs.length});
  if(++done%40==0){document.getElementById('out').textContent=`testando ${done}/${cands.length}`;await new Promise(r=>setTimeout(r,0))}
 }
 res.sort((a,b)=>b.score-a.score);
 document.getElementById('out').textContent='1990s números\n'+res.slice(0,30).map((r,i)=>`${i+1}. ${r.fam} ${r.w}  score=${r.score.toFixed(3)}  espaço médio=${r.ls.toFixed(2)}em`).join('\n');
 window.DONE=true;
})();
</script>
